      - name: Grant Permissions to Android Manifest & Native Bridge
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 -c '
          import os
          p = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(p):
              with open(p, "r", encoding="utf-8") as f:
                  txt = f.read()
              tags = """
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              """
              if "<application" in txt and "<queries>" not in txt:
                  txt = txt.replace("<application", tags + "\n    <application")
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(txt)
          '

          mkdir -p android/app/src/main/java/com/qoolyam3alem/pro
          MAIN_ACTIVITY="android/app/src/main/java/com/qoolyam3alem/pro/MainActivity.java"
          cat << 'EOF' > $MAIN_ACTIVITY
          package com.qoolyam3alem.pro;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
              private SpeechRecognizer speechRecognizer;
              private Handler mainHandler;
              private boolean isUserListening = false;
              private static final int PERMISSION_REQ_CODE = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  mainHandler = new Handler(Looper.getMainLooper());

                  // طلب صلاحيات الميكروفون عند بدء التشغيل
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.MODIFY_AUDIO_SETTINGS
                      }, PERMISSION_REQ_CODE);
                  }

                  // إعداد جسر التعرف الصوتي المباشر والتفاعل مع WebView
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      WebView webView = this.bridge.getWebView();
                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      request.grant(request.getResources());
                                  }
                              });
                          }
                      });
                      webView.addJavascriptInterface(new SpeechNativeInterface(), "AndroidSpeech");
                  }
              }

              private void runJs(final String jsCode) {
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      mainHandler.post(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  bridge.getWebView().evaluateJavascript(jsCode, null);
                              } catch (Exception ignored) {}
                          }
                      });
                  }
              }

              private void initRecognizer() {
                  if (speechRecognizer != null) {
                      try {
                          speechRecognizer.destroy();
                      } catch (Exception ignored) {}
                      speechRecognizer = null;
                  }

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onError('unavailable');");
                      return;
                  }

                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                  speechRecognizer.setRecognitionListener(new RecognitionListener() {
                      @Override
                      public void onReadyForSpeech(Bundle params) {
                          runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onReady();");
                      }

                      @Override
                      public void onBeginningOfSpeech() {
                          runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onSpeechStart();");
                      }

                      @Override
                      public void onRmsChanged(float rmsdB) {}

                      @Override
                      public void onBufferReceived(byte[] buffer) {}

                      @Override
                      public void onEndOfSpeech() {
                          runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onSpeechEnd();");
                      }

                      @Override
                      public void onError(int error) {
                          if (isUserListening) {
                              mainHandler.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (isUserListening) {
                                          startNativeListening("ar-EG");
                                      }
                                  }
                              }, 300);
                          } else {
                              runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onError(" + error + ");");
                          }
                      }

                      @Override
                      public void onResults(Bundle results) {
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              String rawText = matches.get(0);
                              String clean = rawText.replace("'", " ").replace("\"", " ").replace("\\", " ").replace("\n", " ").replace("\r", " ");
                              runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onResult('" + clean + "', true);");
                          }
                          if (isUserListening) {
                              mainHandler.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (isUserListening) {
                                          startNativeListening("ar-EG");
                                      }
                                  }
                              }, 250);
                          }
                      }

                      @Override
                      public void onPartialResults(Bundle partialResults) {
                          ArrayList<String> matches = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && !matches.isEmpty()) {
                              String rawText = matches.get(0);
                              String clean = rawText.replace("'", " ").replace("\"", " ").replace("\\", " ").replace("\n", " ").replace("\r", " ");
                              runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onResult('" + clean + "', false);");
                          }
                      }

                      @Override
                      public void onEvent(int eventType, Bundle params) {}
                  });
              }

              private void startNativeListening(final String lang) {
                  mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (speechRecognizer == null) {
                                  initRecognizer();
                              }
                              if (speechRecognizer != null) {
                                  Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                                  intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, (lang != null && !lang.isEmpty()) ? lang : "ar-EG");
                                  intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                                  intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3);
                                  speechRecognizer.startListening(intent);
                              }
                          } catch (Exception e) {
                              runJs("if(window.AndroidSpeechCallbacks) window.AndroidSpeechCallbacks.onError('start_failed');");
                          }
                      }
                  });
              }

              private void stopNativeListening() {
                  isUserListening = false;
                  mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          if (speechRecognizer != null) {
                              try {
                                  speechRecognizer.stopListening();
                              } catch (Exception ignored) {}
                          }
                      }
                  });
              }

              public class SpeechNativeInterface {
                  @JavascriptInterface
                  public boolean isAvailable() {
                      return SpeechRecognizer.isRecognitionAvailable(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void startListening(final String lang) {
                      isUserListening = true;
                      startNativeListening(lang);
                  }

                  @JavascriptInterface
                  public void stopListening() {
                      stopNativeListening();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (speechRecognizer != null) {
                      try {
                          speechRecognizer.destroy();
                      } catch (Exception ignored) {}
                      speechRecognizer = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

