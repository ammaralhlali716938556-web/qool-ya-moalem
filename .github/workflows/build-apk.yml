            <script>
              class HapticsManager {
                constructor() {
                  this.haptics = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) || null;
                }
                getPlugin() {
                  if (!this.haptics && window.Capacitor && window.Capacitor.Plugins) {
                    this.haptics = window.Capacitor.Plugins.Haptics;
                  }
                  return this.haptics;
                }
                async lightImpact() {
                  try {
                    const plugin = this.getPlugin();
                    if (plugin && plugin.impact) {
                      await plugin.impact({ style: 'LIGHT' });
                      return;
                    }
                  } catch (e) {}
                  if ('vibrate' in navigator) {
                    try { navigator.vibrate(35); } catch(e) {}
                  }
                }
                async successNotification() {
                  try {
                    const plugin = this.getPlugin();
                    if (plugin && plugin.notification) {
                      await plugin.notification({ type: 'SUCCESS' });
                      return;
                    }
                  } catch (e) {}
                  if ('vibrate' in navigator) {
                    try { navigator.vibrate([60, 40, 80]); } catch(e) {}
                  }
                }
                async errorNotification() {
                  try {
                    const plugin = this.getPlugin();
                    if (plugin && plugin.notification) {
                      await plugin.notification({ type: 'ERROR' });
                      return;
                    }
                  } catch (e) {}
                  if ('vibrate' in navigator) {
                    try { navigator.vibrate([90, 50, 150]); } catch(e) {}
                  }
                }
              }

              const haptics = new HapticsManager();

              class SoundFxManager {
                constructor() {
                  this.ctx = null;
                  this.enabled = true;
                  this.compressor = null;
                }
                init() {
                  if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                      this.ctx = new AudioContext();
                      this.compressor = this.ctx.createDynamicsCompressor();
                      this.compressor.threshold.setValueAtTime(-20, this.ctx.currentTime);
                      this.compressor.knee.setValueAtTime(30, this.ctx.currentTime);
                      this.compressor.ratio.setValueAtTime(10, this.ctx.currentTime);
                      this.compressor.attack.setValueAtTime(0, this.ctx.currentTime);
                      this.compressor.release.setValueAtTime(0.25, this.ctx.currentTime);
                      this.compressor.connect(this.ctx.destination);
                    }
                  }
                  if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                  }
                }
                getDestination() {
                  return this.compressor || (this.ctx ? this.ctx.destination : null);
                }
                playClick() {
                  if (!this.enabled) return;
                  try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.04);
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(2500, now);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                    osc.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.getDestination());
                    osc.start(now);
                    osc.stop(now + 0.045);
                  } catch(e) {}
                }
                playStageStart() {
                  if (!this.enabled) return;
                  const notes = [
                    { f: 440.00, t: 0.00, d: 0.09 },
                    { f: 554.37, t: 0.08, d: 0.09 },
                    { f: 659.25, t: 0.16, d: 0.16 }
                  ];
                  notes.forEach(n => {
                    setTimeout(() => this.playSmoothChime(n.f, n.d, 0.22), n.t * 1000);
                  });
                }
                playHintReveal() {
                  if (!this.enabled) return;
                  this.playSmoothChime(987.77, 0.09, 0.24);
                  setTimeout(() => this.playSmoothChime(1318.51, 0.22, 0.28), 75);
                }
                playClueDetected() {
                  if (!this.enabled) return;
                  this.playSmoothChime(659.25, 0.07, 0.22);
                  setTimeout(() => this.playSmoothChime(880.00, 0.14, 0.26), 65);
                }
                playTabooAlarm() {
                  if (!this.enabled) return;
                  try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.22);
                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                    osc.connect(gain);
                    gain.connect(this.getDestination());
                    osc.start(now);
                    osc.stop(now + 0.25);
                  } catch(e) {}
                }
                playSuccessFanfare() {
                  if (!this.enabled) return;
                  const notes = [
                    { f: 523.25, d: 0.12 },
                    { f: 659.25, d: 0.12 },
                    { f: 783.99, d: 0.14 },
                    { f: 1046.50, d: 0.35 }
                  ];
                  notes.forEach((n, i) => {
                    setTimeout(() => this.playSmoothChime(n.f, n.d, 0.28), i * 95);
                  });
                }
                playReward() {
                  if (!this.enabled) return;
                  const notes = [440, 554.37, 659.25, 880];
                  notes.forEach((freq, idx) => {
                    setTimeout(() => this.playSmoothChime(freq, 0.2, 0.25), idx * 85);
                  });
                }
                playSmoothChime(freq, duration = 0.15, vol = 0.2) {
                  if (!this.enabled) return;
                  try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(vol, now + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(this.getDestination());
                    osc.start(now);
                    osc.stop(now + duration);
                  } catch(e) {}
                }
              }

              const soundFx = new SoundFxManager();

