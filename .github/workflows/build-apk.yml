name: Build Android APK with Super AI Fixes & Permanent Clues

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true

      - name: Build Standalone Offline Assets & Generate App
        run: |
          # 1. إنشاء package.json باسم متوافق وتثبيت المكتبات
          cat << 'EOF' > package.json
          {
            "name": "qool-ya-m3alem-pro",
            "version": "1.0.0",
            "private": true
          }
          EOF

          npm install -D tailwindcss@3 @fortawesome/fontawesome-free canvas-confetti
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor/app@6.0.0 @capacitor/haptics@6.0.0

          mkdir -p www/css www/js www/webfonts

          # نسخ ملفات FontAwesome محلياً
          cp -f node_modules/@fortawesome/fontawesome-free/css/all.min.css www/css/fontawesome.min.css
          cp -rf node_modules/@fortawesome/fontawesome-free/webfonts/* www/webfonts/

          # نسخ مؤثرات Confetti محلياً
          cp -f node_modules/canvas-confetti/dist/confetti.browser.js www/js/confetti.browser.min.js || cp -f node_modules/canvas-confetti/src/confetti.js www/js/confetti.browser.min.js

          # 2. إنشاء ملف الواجهة التفاعلية بالكامل
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>قول يا معلّم | النسخة الذهبية الفائقة 👑</title>
            <link rel="stylesheet" href="css/fontawesome.min.css">
            <link rel="stylesheet" href="css/tailwind.min.css">
            <script src="js/confetti.browser.min.js"></script>
            <style>
              * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
              .hidden { display: none !important; }
              body {
                font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background: linear-gradient(165deg, #060911 0%, #0f172a 50%, #1e1b4b 100%);
                min-height: 100vh;
                margin: 0;
                overflow-x: hidden;
              }
              .font-tajawal {
                font-family: 'Tajawal', 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              }
              .btn-3d {
                transition: all 0.15s ease;
                box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 10px 18px rgba(0,0,0,0.3);
              }
              .btn-3d:active:not(:disabled) {
                transform: translateY(4px);
                box-shadow: 0 2px 0 rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
              }
              .clay-card {
                background: rgba(255, 255, 255, 0.97);
                border-radius: 24px;
                box-shadow: 0 18px 32px rgba(0, 0, 0, 0.4);
              }
              @keyframes ready-pulse {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #10b981); }
                50% { transform: scale(1.03); filter: drop-shadow(0 0 22px #34d399); }
              }
              .btn-next-ready {
                animation: ready-pulse 1.2s infinite;
              }
              @keyframes gift-bounce {
                0%, 100% { transform: translateY(0) rotate(0deg); }
                50% { transform: translateY(-8px) rotate(4deg); }
              }
              .gift-bounce { animation: gift-bounce 2s infinite ease-in-out; }
              .no-scrollbar::-webkit-scrollbar { display: none; }
              .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

              @keyframes m3alem-breathe {
                0%, 100% { transform: translateY(0px) scale(1); }
                50% { transform: translateY(-3px) scale(1.015); }
              }
              @keyframes m3alem-blink {
                0%, 96%, 100% { transform: scaleY(1); }
                98% { transform: scaleY(0.08); }
              }
              @keyframes m3alem-tassel-swing {
                0%, 100% { transform: rotate(0deg); }
                25% { transform: rotate(14deg); }
                75% { transform: rotate(-10deg); }
              }
              @keyframes m3alem-listen-glow {
                0%, 100% { filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.7)); }
                50% { filter: drop-shadow(0 0 28px rgba(52, 211, 153, 1)); }
              }
              @keyframes m3alem-angry-headshake {
                0%, 100% { transform: translate(0, 0) rotate(0deg); }
                20% { transform: translate(-5px, 0) rotate(-4deg); }
                40% { transform: translate(5px, 0) rotate(4deg); }
                60% { transform: translate(-3px, 0) rotate(-2deg); }
                80% { transform: translate(3px, 0) rotate(2deg); }
              }
              @keyframes m3alem-happy-cheer {
                0%, 100% { transform: translateY(0) scale(1); }
                30% { transform: translateY(-12px) scale(1.06); }
                60% { transform: translateY(-4px) scale(1.02); }
              }
              @keyframes mic-pulse-ring {
                0% { transform: scale(0.95); opacity: 0.8; }
                50% { transform: scale(1.25); opacity: 0; }
                100% { transform: scale(0.95); opacity: 0; }
              }

              .m3alem-avatar-breathe {
                animation: m3alem-breathe 3.5s ease-in-out infinite;
                transform-origin: center bottom;
              }
              .m3alem-eyes-blink {
                animation: m3alem-blink 4.2s infinite ease-in-out;
                transform-origin: 100px 108px;
              }
              .m3alem-tassel-anim {
                animation: m3alem-tassel-swing 2.8s infinite ease-in-out;
                transform-origin: 110px 48px;
              }
              .m3alem-listening-state {
                animation: m3alem-listen-glow 1.4s infinite ease-in-out;
              }
              .m3alem-happy-state {
                animation: m3alem-happy-cheer 0.9s ease-in-out infinite;
              }
              .m3alem-angry-state {
                animation: m3alem-angry-headshake 0.4s ease-in-out infinite;
              }

              .mic-ripple-ring {
                animation: mic-pulse-ring 1.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
              }

              .m3alem-speech-bubble {
                position: relative;
                background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
                border: 2px solid #4338ca;
                border-radius: 18px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
              }
              .m3alem-speech-bubble::after {
                content: '';
                position: absolute;
                bottom: -11px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 11px 11px 0;
                border-style: solid;
                border-color: #ffffff transparent transparent transparent;
                display: block;
                width: 0;
              }
              .m3alem-speech-bubble::before {
                content: '';
                position: absolute;
                bottom: -14px;
                left: 50%;
                transform: translateX(-50%);
                border-width: 14px 14px 0;
                border-style: solid;
                border-color: #4338ca transparent transparent transparent;
                display: block;
                width: 0;
              }
            </style>
          </head>
          <body class="flex justify-center items-center select-none min-h-screen">
            <div id="appContainer" class="w-full max-w-[440px] h-[100dvh] sm:h-[900px] bg-slate-950 sm:rounded-[40px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-8 border-indigo-500/30">
              
              <header class="w-full px-4 pt-3 pb-2 flex justify-between items-center z-20 bg-slate-900/90 backdrop-blur-md border-b border-white/10">
                <div class="flex items-center space-x-2 space-x-reverse">
                  <div class="bg-gradient-to-r from-amber-400 to-yellow-400 text-amber-950 font-black text-xs px-3 py-1 rounded-full flex items-center space-x-1.5 space-x-reverse shadow-md border border-yellow-200">
                    <span class="text-sm">⭐</span>
                    <span id="starsBalanceDisplay">1000</span>
                    <span class="text-[10px] text-amber-900 font-bold">نجمة</span>
                  </div>
                  <span class="text-white text-xs font-bold">المرحلة: <span id="currentLevelNav" class="text-yellow-300 font-black">1</span></span>
                </div>
                <div class="flex items-center space-x-1.5 space-x-reverse">
                  <button id="btnSoundToggle" onclick="window.game.toggleSound()" title="تشغيل / كتم الصوت" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-emerald-400"></i>
                  </button>
                  <button onclick="window.game.showScreen('screenMap')" title="الخريطة" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i class="fa-solid fa-map-location-dot"></i>
                  </button>
                  <button onclick="window.game.showHome()" title="الرئيسية" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i class="fa-solid fa-house"></i>
                  </button>
                </div>
              </header>

              <div id="screenHome" class="flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-2">
                  <div class="w-24 h-24 mx-auto bg-gradient-to-tr from-amber-500 via-indigo-600 to-emerald-400 rounded-3xl flex items-center justify-center shadow-2xl transform rotate-3 border-4 border-amber-300/60">
                    <span class="text-5xl">👑</span>
                  </div>
                  <h1 class="text-3xl font-black text-white mt-3 font-tajawal drop-shadow">قول يا معلّم!</h1>
                  <p class="text-indigo-200 text-xs font-bold mt-1">تحدي الـ 200 مرحلة مع شخصية المعلّم التفاعلية ومحلل الصوت الفائق 🎙️⚡</p>
                </div>

                <div class="w-full clay-card p-4 text-right space-y-2">
                  <div class="flex items-center space-x-2 space-x-reverse text-indigo-950 font-black text-xs border-b pb-1.5">
                    <i class="fa-solid fa-bolt text-amber-500 text-sm"></i>
                    <span>مميزات النسخة الفائقة ومحلل الصوت:</span>
                  </div>
                  <p class="text-[11px] text-slate-700 leading-relaxed font-bold">
                    • <strong>كتابة صوتية فورية:</strong> يظهر كلامك حرفاً بحرف أمامك على الشاشة أثناء التحدث مباشرة بدون أي تأخير.<br>
                    • <strong>زر مايك عملاق ومريح:</strong> كبّس عليه بحرية لبدء وإيقاف الاستماع في أي وقت أثناء الشرح.<br>
                    • <strong>شخصية واقعية حية:</strong> المعلّم يتفاعل بملامحه وصوته ومكانته مع كل مرحلة وإجابة تقدمها!
                  </p>
                </div>

                <div class="w-full space-y-3 pb-3">
                  <button onclick="window.game.resumeGame()" class="btn-3d w-full py-4 bg-gradient-to-r from-emerald-500 to-green-600 rounded-3xl border-b-[5px] border-emerald-800 text-white text-xl font-black flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-play"></i>
                    <span>ابدأ اللعب (المرحلة <span id="homeResumeLvl">1</span>)</span>
                  </button>
                  <button onclick="window.game.showScreen('screenMap')" class="btn-3d w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-700 rounded-2xl border-b-[5px] border-indigo-900 text-white font-black text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-map"></i>
                    <span>استعراض خريطة الـ 200 مرحلة 🗺️</span>
                  </button>
                </div>
              </div>

              <div id="screenMap" class="hidden flex-1 flex flex-col z-10 overflow-hidden">
                <div class="px-2 pt-2 pb-1 bg-slate-900/60 border-b border-white/10 flex overflow-x-auto no-scrollbar space-x-1.5 space-x-reverse text-center">
                  <button onclick="window.game.filterWorld(1)" id="tabWorld1" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-indigo-600 text-white shadow">
                    🏡 حارة المبتدئين (1-40)
                  </button>
                  <button onclick="window.game.filterWorld(2)" id="tabWorld2" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    🎬 المشاهير والميمز (41-80)
                  </button>
                  <button onclick="window.game.filterWorld(3)" id="tabWorld3" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    📜 سوق الحِرّيفة (81-120)
                  </button>
                  <button onclick="window.game.filterWorld(4)" id="tabWorld4" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    🔬 برج الخبراء (121-160)
                  </button>
                  <button onclick="window.game.filterWorld(5)" id="tabWorld5" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    👑 عرش الأساطير (161-200)
                  </button>
                </div>

                <div id="worldInfoBanner" class="px-4 py-2 bg-indigo-950/70 text-right flex justify-between items-center text-xs text-indigo-200 border-b border-white/5">
                  <span id="worldNameTitle" class="font-black text-yellow-300">عالم 1: حارة المبتدئين</span>
                  <span id="worldRuleDesc" class="text-[11px] font-bold">الوقت: 60ث • 2 ممنوعات فقط</span>
                </div>

                <div id="stagesScrollContainer" class="flex-1 overflow-y-auto px-4 py-4 grid grid-cols-4 gap-3 text-center content-start"></div>
              </div>

              <div id="screenPlay" class="hidden flex-1 flex flex-col items-center justify-between px-3.5 py-1 z-10 overflow-y-auto no-scrollbar">
                
                <div class="w-full flex justify-between items-center bg-slate-900/80 backdrop-blur-md rounded-2xl px-3.5 py-1.5 border border-white/15 text-white font-bold text-xs shadow">
                  <div class="flex items-center space-x-1.5 space-x-reverse">
                    <span class="text-yellow-400 font-black">مرحلة <span id="playStageNum">#1</span></span>
                    <span id="m3alemPrestigeBadge" class="bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black text-[9px] px-2 py-0.5 rounded-full shadow">
                      المعلّم الصاعد 🔰
                    </span>
                  </div>
                  <div>المحاولات: <span id="playStarsDisplay" class="text-amber-400 font-black tracking-widest">⭐⭐⭐</span></div>
                </div>

                <div class="w-full flex flex-col items-center my-0.5 relative">
                  <div id="m3alemSpeechBubble" class="m3alem-speech-bubble px-3 py-1 mb-1.5 max-w-[320px] text-center z-10 transition-all duration-300">
                    <p id="m3alemQuoteText" class="text-slate-900 font-black text-[11px] leading-tight font-tajawal">
                      "أنا سامعك يا معلّم.. وصّف الكلمة بشطارة ومن غير ما تغلط!" 🎙️
                    </p>
                  </div>

                  <div class="relative flex items-center justify-center">
                    <div id="m3alemCharacterContainer" class="m3alem-avatar-breathe transition-all duration-300 cursor-pointer relative" onclick="window.game.onM3alemClicked()" title="انقر للحديث مع المعلّم">
                      
                      <div id="m3alemAura" class="absolute inset-0 rounded-full bg-emerald-400/20 blur-xl opacity-0 transition-opacity duration-300 pointer-events-none"></div>

                      <svg id="m3alemSvg" class="w-28 h-28 drop-shadow-2xl" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                          <linearGradient id="realSkin" x1="100" y1="50" x2="100" y2="170" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#fed7aa"/>
                            <stop offset="35%" stop-color="#fba86f"/>
                            <stop offset="70%" stop-color="#ea7a40"/>
                            <stop offset="100%" stop-color="#b45309"/>
                          </linearGradient>
                          <radialGradient id="realCheekBlush" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
                          </radialGradient>
                          <linearGradient id="tarbooshVelvet" x1="45" y1="20" x2="155" y2="20" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#450a0a"/>
                            <stop offset="15%" stop-color="#7f1d1d"/>
                            <stop offset="50%" stop-color="#b91c1c"/>
                            <stop offset="85%" stop-color="#7f1d1d"/>
                            <stop offset="100%" stop-color="#450a0a"/>
                          </linearGradient>
                          <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#fef08a"/>
                            <stop offset="50%" stop-color="#f59e0b"/>
                            <stop offset="100%" stop-color="#b45309"/>
                          </linearGradient>
                          <radialGradient id="realIrisGrad" cx="40%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="#b45309"/>
                            <stop offset="45%" stop-color="#78350f"/>
                            <stop offset="85%" stop-color="#451a03"/>
                            <stop offset="100%" stop-color="#18181b"/>
                          </radialGradient>
                          <linearGradient id="mustacheGrad" x1="60" y1="130" x2="140" y2="150" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#18181b"/>
                            <stop offset="50%" stop-color="#27272a"/>
                            <stop offset="100%" stop-color="#09090b"/>
                          </linearGradient>
                        </defs>

                        <circle cx="100" cy="115" r="92" fill="#0f172a" stroke="url(#goldTrim)" stroke-width="4" stroke-opacity="0.85" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))"/>

                        <path d="M40 215 C45 175, 75 168, 100 168 C125 168, 155 175, 160 215 Z" fill="#1e1b4b"/>
                        <path d="M86 168 L100 190 L114 168 Z" fill="#ffffff" stroke="url(#goldTrim)" stroke-width="2"/>
                        <path d="M98 180 L102 180 L102 215 L98 215 Z" fill="url(#goldTrim)"/>
                        <path d="M44 212 C52 182, 70 174, 85 174 L78 215 Z" fill="#b45309" opacity="0.95"/>
                        <path d="M156 212 C148 182, 130 174, 115 174 L122 215 Z" fill="#b45309" opacity="0.95"/>

                        <path d="M78 140 L78 174 C88 180, 112 180, 122 174 L122 140 Z" fill="#d97706" opacity="0.75"/>

                        <ellipse id="realFace" cx="100" cy="112" rx="44" ry="46" fill="url(#realSkin)" stroke="#78350f" stroke-width="1.5" class="transition-colors duration-300"/>
                        
                        <path d="M56 102 C50 102, 50 124, 57 126 C59 122, 58 108, 56 102 Z" fill="#fba86f" stroke="#78350f" stroke-width="1.2"/>
                        <path d="M144 102 C150 102, 150 124, 143 126 C141 122, 142 108, 144 102 Z" fill="#fba86f" stroke="#78350f" stroke-width="1.2"/>

                        <ellipse cx="76" cy="122" rx="10" ry="6" fill="url(#realCheekBlush)"/>
                        <ellipse cx="124" cy="122" rx="10" ry="6" fill="url(#realCheekBlush)"/>

                        <g class="m3alem-eyes-blink">
                          <ellipse cx="79" cy="106" rx="9.5" ry="6.5" fill="#ffffff" stroke="#451a03" stroke-width="1.2"/>
                          <circle cx="80" cy="106" r="4.8" fill="url(#realIrisGrad)"/>
                          <circle cx="80" cy="106" r="2.2" fill="#09090b"/>
                          <circle cx="82" cy="104" r="1.3" fill="#ffffff"/>

                          <ellipse cx="121" cy="106" rx="9.5" ry="6.5" fill="#ffffff" stroke="#451a03" stroke-width="1.2"/>
                          <circle cx="120" cy="106" r="4.8" fill="url(#realIrisGrad)"/>
                          <circle cx="120" cy="106" r="2.2" fill="#09090b"/>
                          <circle cx="122" cy="104" r="1.3" fill="#ffffff"/>
                        </g>

                        <path id="browRight" d="M68 94 Q80 88 90 93" stroke="#27272a" stroke-width="3.5" stroke-linecap="round" fill="none" class="transition-all duration-200"/>
                        <path id="browLeft" d="M110 93 Q120 88 132 94" stroke="#27272a" stroke-width="3.5" stroke-linecap="round" fill="none" class="transition-all duration-200"/>

                        <path d="M98 98 L96 118 Q100 124 104 118 L102 98 Z" fill="#ea580c" opacity="0.35"/>
                        <ellipse cx="100" cy="118" rx="5" ry="3.5" fill="#f97316"/>
                        <circle cx="97" cy="119" r="1.2" fill="#431407"/>
                        <circle cx="103" cy="119" r="1.2" fill="#431407"/>

                        <path id="realMustache" d="M66 128 C80 120, 95 129, 100 133 C105 129, 120 120, 134 128 C140 137, 122 143, 100 138 C78 143, 60 137, 66 128 Z" fill="url(#mustacheGrad)" stroke="#09090b" stroke-width="1.5" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.4))"/>

                        <path id="realMouth" d="M90 144 Q100 149 110 144" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none" class="transition-all duration-200"/>

                        <g id="realTarbooshGroup">
                          <path d="M68 68 L76 22 L124 22 L132 68 Z" fill="url(#tarbooshVelvet)" stroke="#450a0a" stroke-width="2"/>
                          <ellipse cx="100" cy="22" rx="24" ry="7" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5"/>
                          <path d="M68 67 Q100 74 132 67" stroke="url(#goldTrim)" stroke-width="3" fill="none"/>
                          <circle cx="100" cy="22" r="3" fill="#18181b" stroke="url(#goldTrim)" stroke-width="1"/>

                          <g id="realTassel" class="m3alem-tassel-anim">
                            <path d="M100 22 Q115 30 118 46" stroke="#18181b" stroke-width="2.5" fill="none"/>
