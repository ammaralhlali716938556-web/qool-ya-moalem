                      "دلالة معلمة وصحيحة 100%! كمّل شرحك!",
                      "جدع يا فنان.. المعلّم راضي ومبسوط منك!"
                    ],
                    happy: [
                      "يا صلاة الزين! هو ده المعلم الحقيقي اللي يشرف! 👑",
                      "الله عليك يا حبيب والديك.. فن وبلاغة ميت فل وعشرة!",
                      "برافو يا أسطورة! شرحك يقنع الصخر!",
                      "ختمتها يا كبير.. تستاهل النجوم والتاج!"
                    ],
                    angry: [
                      "قفشتك يا معلم! نطقت كلمة محظورة ونقصت نجمة! 🚨",
                      "جرى إيه يا حبيبنا؟! الكلمة دي من الممنوعات!",
                      "يا وقعة مربربة! خروج عن النص.. ركّز وابتعد عن المحظور!",
                      "كارت أحمر يا بطل! متقولش الممنوعات تاني!"
                    ]
                  };
                }

                updateWorldStage(worldNum) {
                  const badge = document.getElementById('m3alemPrestigeBadge');
                  if (badge) {
                    badge.innerText = this.worldTitles[worldNum] || this.worldTitles[1];
                  }
                }

                setState(state, customQuote = null) {
                  this.currentState = state;
                  const container = document.getElementById('m3alemCharacterContainer');
                  const aura = document.getElementById('m3alemAura');
                  const mouth = document.getElementById('realMouth');
                  const browR = document.getElementById('browRight');
                  const browL = document.getElementById('browLeft');
                  const crown = document.getElementById('victoryCrown');
                  const penaltyCard = document.getElementById('penaltyCard');

                  if (!container) return;

                  container.className = 'transition-all duration-300 cursor-pointer relative';
                  if (aura) aura.className = 'absolute inset-0 rounded-full blur-xl opacity-0 transition-opacity duration-300 pointer-events-none';
                  if (crown) crown.classList.add('hidden');
                  if (penaltyCard) penaltyCard.classList.add('hidden');

                  if (state === 'idle') {
                    container.classList.add('m3alem-avatar-breathe');
                    if (browR) browR.setAttribute('d', 'M68 94 Q80 88 90 93');
                    if (browL) browL.setAttribute('d', 'M110 93 Q120 88 132 94');
                    if (mouth) mouth.setAttribute('d', 'M90 144 Q100 149 110 144');
                  } else if (state === 'listening') {
                    container.classList.add('m3alem-listening-state');
                    if (aura) aura.className = 'absolute inset-0 rounded-full bg-emerald-400/35 blur-xl opacity-100 transition-opacity duration-300 pointer-events-none';
                  } else if (state === 'clue') {
                    container.classList.add('m3alem-listening-state');
                    if (aura) aura.className = 'absolute inset-0 rounded-full bg-amber-400/45 blur-2xl opacity-100 transition-opacity duration-300 pointer-events-none';
                  } else if (state === 'happy') {
                    container.classList.add('m3alem-happy-state');
                    if (crown) crown.classList.remove('hidden');
                  } else if (state === 'angry') {
                    container.classList.add('m3alem-angry-state');
                    if (penaltyCard) penaltyCard.classList.remove('hidden');
                  }

                  this.sayQuote(state, customQuote);
                }

                sayQuote(category, customText = null) {
                  const quoteEl = document.getElementById('m3alemQuoteText');
                  const bubble = document.getElementById('m3alemSpeechBubble');
                  if (!quoteEl || !bubble) return;

                  let text = customText;
                  if (!text) {
                    const list = this.quotes[category] || this.quotes.idle;
                    text = list[Math.floor(Math.random() * list.length)];
                  }

                  quoteEl.innerText = `"${text}"`;
                  bubble.classList.remove('scale-95');
                  bubble.classList.add('scale-105');
                  setTimeout(() => bubble.classList.remove('scale-105'), 200);

                  if (category === 'angry' || category === 'clue') {
                    if (this.speechTimeout) clearTimeout(this.speechTimeout);
                    this.speechTimeout = setTimeout(() => {
                      if (window.game && window.game.isPlaying && !window.game.isSuccessApproved) {
                        this.setState(window.game.isVoiceActive ? 'listening' : 'idle');
                      }
                    }, 3200);
                  }
                }
              }

              const m3alem = new RealisticM3alemManager();

              const RAW_STAGES = [
                {w:"كشري", t:["صلصة", "عدس"], c:"أكلات شعبية", h:["حلة", "شطة", "مصري", "طعام"]},
                {w:"شاي بلبن", t:["شاي", "حليب"], c:"مشروبات", h:["كوب", "صباح", "سخن", "إفطار"]},
                {w:"بطيخ", t:["أحمر", "بزر"], c:"فواكه", h:["صيف", "سكين", "ساقع", "قشر"]},
                {w:"فلافل", t:["طعمية", "زيت"], c:"أكلات شعبية", h:["فول", "قلي", "سندوتش", "مطعم"]},
                {w:"شاحن", t:["سلك", "كهرباء"], c:"أجهزة", h:["طاقة", "موبايل", "تلفون", "بطارية"]}
              ];

              const WORLDS_CONFIG = {
                1: { title: "عالم 1: حارة المبتدئين", time: 60, taboos: 2, range: [1, 40], desc: "الوقت: 60ث • كلمتان ممنوعتان فقط" }
              };

              class SuperAIGameEngine {
                constructor() {
                  this.currentStageNum = 1;
                  this.selectedWorld = 1;
                  this.timer = 60;
                  this.timerInterval = null;
                  this.busts = 0;
                  this.recognition = null;
                  this.isPlaying = false;
                  this.isVoiceActive = false;
                  this.userWantsVoice = false;
                  this.isSuccessApproved = false;
                  this.currentScreen = 'screenHome';
                  this.detectedCluesSet = new Set();
                  this.sessionFinalTranscript = '';

                  this.loadProgress();
                  this.initSoundState();
                  this.setupNativeSpeechBridge();
                  this.renderMap();
                  this.updateHeaderUI();
                }

                setupNativeSpeechBridge() {
                  window.AndroidSpeechCallbacks = {
                    onReady: () => {
                      this.isVoiceActive = true;
                      this.updateMicUI(true);
                      m3alem.setState('listening');
                    },
                    onSpeechStart: () => {},
                    onSpeechEnd: () => {},
                    onResult: (text, isFinal) => {
                      this.handleVoiceResult(text, isFinal);
                    },
                    onError: (err) => {
                      console.warn("Native speech error:", err);
                    }
                  };
                }

                handleVoiceResult(text, isFinal) {
                  if (!this.isPlaying || this.isSuccessApproved) return;
                  if (!text || !text.trim()) return;

                  const trimmed = text.trim();
                  if (isFinal) {
                    this.sessionFinalTranscript = (this.sessionFinalTranscript + ' ' + trimmed).trim();
                  }
                  const currentLiveSpeech = isFinal ? this.sessionFinalTranscript : (this.sessionFinalTranscript + ' ' + trimmed).trim();
                  
                  const transcriptBox = document.getElementById('playTranscript');
                  if (transcriptBox && currentLiveSpeech) {
                    transcriptBox.innerHTML = `<span class="text-emerald-400 font-black">🎙️ </span><span class="text-white">${currentLiveSpeech}</span>`;
                  }
                  this.processRealtimeSpeech(currentLiveSpeech);
                }

                loadProgress() {
                  this.progress = {
                    maxUnlocked: 1,
                    stars: {},
                    starsBalance: 1000,
                    soundEnabled: true,
                    revealedCluesMap: {},
                    completedStages: {}
                  };
                }

                saveProgress() {
                  this.updateHeaderUI();
                }

                initSoundState() {
                  soundFx.enabled = this.progress.soundEnabled;
                }

                toggleSound() {
                  haptics.lightImpact();
                  this.progress.soundEnabled = !this.progress.soundEnabled;
                  soundFx.enabled = this.progress.soundEnabled;
                }

                updateHeaderUI() {
                  document.getElementById('starsBalanceDisplay').innerText = this.progress.starsBalance;
                  document.getElementById('currentLevelNav').innerText = this.progress.maxUnlocked;
                  document.getElementById('homeResumeLvl').innerText = this.progress.maxUnlocked;
                }

                onM3alemClicked() {
                  haptics.lightImpact();
                  soundFx.playClick();
                  m3alem.sayQuote(this.isVoiceActive ? 'listening' : 'idle');
                }

                buyHint() {
                  haptics.lightImpact();
                  soundFx.playClick();
                  alert("💡 تم كشف الدلالة بنجاح!");
                }

                promptTextInput() {
                  const input = prompt("💬 اكتب شرحك للكلمة:");
                  if (input && input.trim()) {
                    this.handleVoiceResult(input.trim(), true);
                  }
                }

                processRealtimeSpeech(rawText) {
                  if (!this.isPlaying || this.isSuccessApproved || !this.activeStage) return;
                  if (rawText.includes(this.activeStage.w)) {
                    this.onBust("ذكرت الكلمة نفسها!");
                    return;
                  }
                  this.activeStage.h.forEach(hint => {
                    if (rawText.includes(hint) && !this.detectedCluesSet.has(hint)) {
                      this.detectedCluesSet.add(hint);
                      m3alem.setState('clue', `الله عليك! ذكرت دلالة: ${hint}`);
                    }
                  });
                  if (this.detectedCluesSet.size >= 1) {
                    this.triggerAutoSuccess();
                  }
                }

                triggerAutoSuccess() {
                  if (this.isSuccessApproved) return;
                  this.isSuccessApproved = true;
                  clearInterval(this.timerInterval);
                  m3alem.setState('happy');
                  soundFx.playSuccessFanfare();
                  setTimeout(() => this.showScreen('screenWin'), 1500);
                }

                onBust(reason) {
                  this.busts++;
                  m3alem.setState('angry');
                  soundFx.playTabooAlarm();
                  alert("🚨 " + reason);
                }

                startStage(lvl) {
                  this.currentStageNum = lvl || 1;
                  this.activeStage = RAW_STAGES[0];
                  this.isPlaying = true;
                  this.isSuccessApproved = false;
                  this.detectedCluesSet.clear();
                  this.showScreen('screenPlay');
                  m3alem.setState('idle');
                }

                resumeGame() {
                  this.startStage(1);
                }

                renderMap() {
                  const container = document.getElementById('stagesScrollContainer');
                  if (!container) return;
                  container.innerHTML = '';
                  for (let i = 1; i <= 40; i++) {
                    const btn = document.createElement('div');
                    btn.className = 'stage-node flex flex-col items-center justify-center p-2 rounded-2xl cursor-pointer bg-indigo-950/60 border border-indigo-400/40 text-white';
                    btn.innerHTML = `<div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-sm bg-indigo-600">${i}</div>`;
                    btn.onclick = () => window.game.startStage(i);
                    container.appendChild(btn);
                  }
                }

                showScreen(id) {
                  ['screenHome', 'screenMap', 'screenPlay', 'screenWin'].forEach(s => {
                    const el = document.getElementById(s);
                    if (el) el.classList.add('hidden');
                  });
                  const target = document.getElementById(id);
                  if (target) target.classList.remove('hidden');
                  this.currentScreen = id;
                }

                showHome() {
                  this.showScreen('screenHome');
                }

                toggleMicManual() {
                  if (window.AndroidSpeech && typeof window.AndroidSpeech.startListening === 'function') {
                    if (this.isVoiceActive) {
                      window.AndroidSpeech.stopListening();
                      this.isVoiceActive = false;
                      this.updateMicUI(false);
                      m3alem.setState('idle');
                    } else {
                      window.AndroidSpeech.startListening('ar-EG');
                      this.isVoiceActive = true;
                      this.updateMicUI(true);
                      m3alem.setState('listening');
                    }
                  } else {
                    this.promptTextInput();
                  }
                }

                updateMicUI(active) {
                  const mic = document.getElementById('micIndicator');
                  if (mic) {
                    mic.className = active
                      ? "btn-3d w-20 h-20 rounded-full bg-gradient-to-tr from-rose-600 to-amber-500 text-white flex flex-col items-center justify-center shadow-2xl ring-8 ring-rose-500/40 animate-pulse"
                      : "btn-3d w-20 h-20 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex flex-col items-center justify-center shadow-2xl ring-4 ring-emerald-400/40";
                  }
                }
              }

              window.game = new SuperAIGameEngine();
            </script>
          </body>
          </html>
          EOF

