name: Build Android APK with Super AI Fixes & Permanent Clues

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Standalone Offline Assets & Generate App
        run: |
          # 1. تثبيت مكتبات التصميم والأيقونات ومكتبات كاباسيتور محلياً
          npm init -y
          npm install -D tailwindcss@3 @fortawesome/fontawesome-free canvas-confetti
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0 @capacitor/app@6.0.0 @capacitor/haptics@6.0.0

          mkdir -p www/css www/js www/webfonts

          # نسخ ملفات الأيقونات والخطوط الخاصة بـ FontAwesome محلياً
          cp -f node_modules/@fortawesome/fontawesome-free/css/all.min.css www/css/fontawesome.min.css
          cp -rf node_modules/@fortawesome/fontawesome-free/webfonts/* www/webfonts/

          # نسخ مؤثرات الفوز (Confetti) محلياً
          cp -f node_modules/canvas-confetti/dist/confetti.browser.js www/js/confetti.browser.min.js

          # 2. إنشاء ملف الواجهة التفاعلية بالكامل
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>قول يا معلّم | النسخة الذهبية الفائقة 👑</title>
            <!-- ملفات التنسيق والأيقونات المحلية لتعمل 100% بدون إنترنت -->
            <link rel="stylesheet" href="css/fontawesome.min.css">
            <link rel="stylesheet" href="css/tailwind.min.css">
            <script src="js/confetti.browser.min.js"></script>
            <style>
              * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
              .hidden { display: none !important; }
              body {
                font-family: 'Cairo', 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                background: linear-gradient(165deg, #090d16 0%, #111827 50%, #1e1b4b 100%);
                min-height: 100vh;
                margin: 0;
                overflow-x: hidden;
              }
              .font-tajawal {
                font-family: 'Tajawal', 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              }
              .btn-3d {
                transition: all 0.15s ease;
                box-shadow: 0 6px 0 rgba(0,0,0,0.3), 0 10px 15px rgba(0,0,0,0.25);
              }
              .btn-3d:active:not(:disabled) {
                transform: translateY(4px);
                box-shadow: 0 2px 0 rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
              }
              .clay-card {
                background: rgba(255, 255, 255, 0.96);
                border-radius: 24px;
                box-shadow: 0 18px 30px rgba(0, 0, 0, 0.35);
              }
              @keyframes ready-pulse {
                0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #10b981); }
                50% { transform: scale(1.03); filter: drop-shadow(0 0 20px #34d399); }
              }
              .btn-next-ready {
                animation: ready-pulse 1.2s infinite;
              }
              @keyframes gift-bounce {
                0%, 100% { transform: translateY(0) rotate(0deg); }
                50% { transform: translateY(-8px) rotate(4deg); }
              }
              .gift-bounce { animation: gift-bounce 2s infinite ease-in-out; }
              .no-scrollbar::-webkit-scrollbar { display: none; }
              .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            </style>
          </head>
          <body class="flex justify-center items-center select-none min-h-screen">

            <div id="appContainer" class="w-full max-w-[440px] h-[100dvh] sm:h-[900px] bg-slate-950 sm:rounded-[40px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-8 border-indigo-500/30">
              
              <!-- TOP GLOBAL HEADER -->
              <header class="w-full px-4 pt-3 pb-2 flex justify-between items-center z-20 bg-slate-900/90 backdrop-blur-md border-b border-white/10">
                <div class="flex items-center space-x-2 space-x-reverse">
                  <!-- STARS WALLET -->
                  <div class="bg-gradient-to-r from-amber-400 to-yellow-400 text-amber-950 font-black text-xs px-3 py-1 rounded-full flex items-center space-x-1.5 space-x-reverse shadow-md border border-yellow-200">
                    <span class="text-sm">⭐</span>
                    <span id="starsBalanceDisplay">1000</span>
                    <span class="text-[10px] text-amber-900 font-bold">نجمة</span>
                  </div>
                  <span class="text-white text-xs font-bold">المرحلة: <span id="currentLevelNav" class="text-yellow-300 font-black">1</span></span>
                </div>
                <div class="flex items-center space-x-1.5 space-x-reverse">
                  <!-- SOUND TOGGLE (MUTE / UNMUTE) -->
                  <button id="btnSoundToggle" onclick="window.game.toggleSound()" title="تشغيل / كتم الصوت" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-emerald-400"></i>
                  </button>
                  <button onclick="window.game.showScreen('screenMap')" title="الخريطة" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i class="fa-solid fa-map-location-dot"></i>
                  </button>
                  <button onclick="window.game.showHome()" title="الرئيسية" class="w-9 h-9 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition">
                    <i class="fa-solid fa-house"></i>
                  </button>
                </div>
              </header>

              <!-- SCREEN 1: HOME -->
              <div id="screenHome" class="flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-2">
                  <div class="w-24 h-24 mx-auto bg-gradient-to-tr from-indigo-500 to-emerald-400 rounded-3xl flex items-center justify-center shadow-2xl transform rotate-3 border-4 border-indigo-300">
                    <span class="text-5xl">👑</span>
                  </div>
                  <h1 class="text-3xl font-black text-white mt-3 font-tajawal drop-shadow">قول يا معلّم!</h1>
                  <p class="text-indigo-200 text-xs font-bold mt-1">تحدي الـ 200 مرحلة مع محلل الدلالات الصوتي فائق الحساسية 🎙️⚡</p>
                </div>

                <div class="w-full clay-card p-4 text-right space-y-2">
                  <div class="flex items-center space-x-2 space-x-reverse text-indigo-950 font-black text-xs border-b pb-1.5">
                    <i class="fa-solid fa-bolt text-amber-500 text-sm"></i>
                    <span>طريقة اللعب والتحكم بالمايك:</span>
                  </div>
                  <p class="text-[11px] text-slate-700 leading-relaxed font-bold">
                    • <strong>تحكم يدوي كامل بالتسجيل:</strong> المايك لا يبدأ تلقائياً، انقر زر المايك عند رغبتك بالشرح واضغط لإيقافه في أي وقت.<br>
                    • <strong>حساسية فائقة للصوت:</strong> يحلل الكلمات والهمسات وتلميحاتك حتى لو كان الصوت منخفضاً.<br>
                    • <strong>كشف سريع للدلالات:</strong> يكتشف الكلمات المطلوبة وشبيهاتها بسرعة خاطفة ويرفع شريط الذكاء مباشرة!
                  </p>
                </div>

                <div class="w-full space-y-3 pb-3">
                  <button onclick="window.game.resumeGame()" class="btn-3d w-full py-4 bg-gradient-to-r from-emerald-500 to-green-600 rounded-3xl border-b-[5px] border-emerald-800 text-white text-xl font-black flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-play"></i>
                    <span>ابدأ اللعب (المرحلة <span id="homeResumeLvl">1</span>)</span>
                  </button>
                  <button onclick="window.game.showScreen('screenMap')" class="btn-3d w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-700 rounded-2xl border-b-[5px] border-indigo-900 text-white font-black text-sm flex items-center justify-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-map"></i>
                    <span>استعراض خريطة الـ 200 مرحلة 🗺️</span>
                  </button>
                </div>
              </div>

              <!-- SCREEN 2: LEVEL MAP (200 STAGES) -->
              <div id="screenMap" class="hidden flex-1 flex flex-col z-10 overflow-hidden">
                <div class="px-2 pt-2 pb-1 bg-slate-900/60 border-b border-white/10 flex overflow-x-auto no-scrollbar space-x-1.5 space-x-reverse text-center">
                  <button onclick="window.game.filterWorld(1)" id="tabWorld1" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-indigo-600 text-white shadow">
                    🏡 حارة المبتدئين (1-40)
                  </button>
                  <button onclick="window.game.filterWorld(2)" id="tabWorld2" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    🎬 المشاهير والميمز (41-80)
                  </button>
                  <button onclick="window.game.filterWorld(3)" id="tabWorld3" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    📜 سوق الحِرّيفة (81-120)
                  </button>
                  <button onclick="window.game.filterWorld(4)" id="tabWorld4" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    🔬 برج الخبراء (121-160)
                  </button>
                  <button onclick="window.game.filterWorld(5)" id="tabWorld5" class="px-3 py-1.5 rounded-xl font-black text-xs whitespace-nowrap bg-white/10 text-gray-300">
                    👑 عرش الأساطير (161-200)
                  </button>
                </div>

                <div id="worldInfoBanner" class="px-4 py-2 bg-indigo-950/70 text-right flex justify-between items-center text-xs text-indigo-200 border-b border-white/5">
                  <span id="worldNameTitle" class="font-black text-yellow-300">عالم 1: حارة المبتدئين</span>
                  <span id="worldRuleDesc" class="text-[11px] font-bold">الوقت: 60ث • 2 ممنوعات فقط</span>
                </div>

                <div id="stagesScrollContainer" class="flex-1 overflow-y-auto px-4 py-4 grid grid-cols-4 gap-3 text-center content-start"></div>
              </div>

              <!-- SCREEN 3: GAMEPLAY -->
              <div id="screenPlay" class="hidden flex-1 flex flex-col items-center justify-between px-4 py-2 z-10">
                <!-- TOP STAGE INFO -->
                <div class="w-full flex justify-between items-center bg-white/10 backdrop-blur-md rounded-2xl px-4 py-1.5 border border-white/20 text-white font-bold text-xs">
                  <div>المرحلة: <span id="playStageNum" class="text-yellow-300 font-black">#1</span> (<span id="playWorldTag" class="text-indigo-200">حارة المبتدئين</span>)</div>
                  <div>المحاولات السليمة: <span id="playStarsDisplay" class="text-amber-400 font-black">⭐⭐⭐</span></div>
                </div>

                <!-- TIMER & LIVE MIC ICON (MANUAL TOGGLE) -->
                <div class="flex items-center space-x-3 space-x-reverse my-1">
                  <div class="flex flex-col items-center">
                    <div id="micIndicator" onclick="window.game.toggleMicManual()" title="انقر لبدء التحدث والشرح" class="w-14 h-14 rounded-full bg-slate-700 text-emerald-400 flex items-center justify-center text-xl shadow-lg ring-4 ring-white/10 cursor-pointer transition active:scale-95">
                      <i class="fa-solid fa-microphone"></i>
                    </div>
                    <span id="micActionHint" class="text-[9px] font-black text-amber-300 mt-1">اضغط للتحدث</span>
                  </div>
                  <div class="text-right">
                    <div class="text-[11px] text-gray-300 font-bold">الوقت المتبقي:</div>
                    <div id="playTimerText" class="text-3xl font-black text-yellow-300 font-tajawal">60s</div>
                  </div>
                </div>

                <!-- NOTICE BANNER FOR PERMISSION OR MIC ISSUES (NON-BLOCKING) -->
                <div id="micPermissionAlert" class="hidden w-full bg-amber-500/20 border border-amber-400/40 text-amber-200 rounded-xl px-3 py-1.5 flex items-center justify-between text-xs font-bold mb-1">
                  <div class="flex items-center space-x-1.5 space-x-reverse">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
                    <span>الميكروفون غير متاح حالياً. يمكنك استخدام الإدخال النصي!</span>
                  </div>
                  <button onclick="window.game.promptTextInput()" class="bg-amber-400 text-amber-950 px-2.5 py-0.5 rounded-lg text-[10px] font-black hover:bg-amber-300 active:scale-95 transition">
                    اكتب الآن
                  </button>
                </div>

                <!-- CARD -->
                <div class="w-full clay-card p-4 relative overflow-hidden text-center shadow-2xl border-4 border-indigo-200">
                  <div class="flex justify-between items-center mb-1">
                    <span id="playCategory" class="bg-indigo-100 text-indigo-900 text-[10px] font-black px-2.5 py-0.5 rounded-full">
                      أكلات شعبية
                    </span>

                    <div class="flex items-center space-x-1.5 space-x-reverse">
                      <!-- QUICK TEXT INPUT FALLBACK BUTTON -->
                      <button onclick="window.game.promptTextInput()" title="كتابة الشرح بالكيبورد" class="p-1 px-2.5 bg-indigo-50 text-indigo-900 font-black text-[11px] rounded-xl border border-indigo-200 hover:bg-indigo-100 active:scale-95 transition flex items-center space-x-1 space-x-reverse shadow-sm">
                        <i class="fa-solid fa-keyboard text-indigo-600"></i>
                        <span>كتابة</span>
                      </button>

                      <!-- HINT PURCHASE BUTTON -->
                      <button id="btnBuyHint" onclick="window.game.buyHint()" class="btn-3d py-1 px-2.5 bg-gradient-to-r from-amber-400 to-yellow-400 text-amber-950 font-black text-[11px] rounded-xl flex items-center space-x-1 space-x-reverse border border-amber-200 shadow active:scale-95 transition">
                        <span>💡</span>
                        <span id="hintBtnLabel">كشف دلالة (-30 ⭐)</span>
                      </button>
                    </div>
                  </div>

                  <div id="playWord" class="text-3xl font-black text-slate-900 my-1 font-tajawal">
                    كشري
                  </div>

                  <!-- PERMANENTLY REVEALED HINTS BANNER -->
                  <div id="revealedHintBanner" class="hidden mb-2 p-1.5 bg-amber-50 border border-amber-300 rounded-xl text-right">
                    <div class="text-[10px] font-black text-amber-900 flex items-center space-x-1 space-x-reverse mb-0.5">
                      <span>💡</span>
                      <span>دلالات مكشوفة لك (تحدث عنها أو عن كلمات تشبهها):</span>
                    </div>
                    <div id="revealedHintsContainer" class="flex flex-wrap gap-1 text-xs font-bold text-amber-950"></div>
                  </div>

                  <!-- TABOOS -->
                  <div class="bg-red-50 border border-red-200 rounded-xl p-2 text-right">
                    <div class="flex justify-between items-center mb-1 text-red-600 font-black text-[11px]">
                      <div class="flex items-center space-x-1 space-x-reverse">
                        <i class="fa-solid fa-ban"></i>
                        <span>الممنوعات على لسانك:</span>
                      </div>
                      <span id="playTabooCountLabel" class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">2 كلمات</span>
                    </div>
                    <div id="playTaboosContainer" class="flex flex-wrap gap-1.5 text-xs font-bold text-slate-800"></div>
                  </div>

                  <!-- AI CONFIDENCE RADAR BAR -->
                  <div class="mt-2 pt-2 border-t border-slate-200 text-right">
                    <div class="flex justify-between items-center text-[10px] font-bold text-slate-600 mb-1">
                      <span><i class="fa-solid fa-brain text-indigo-600"></i> اقتناع الذكاء الاصطناعي بشرحك:</span>
                      <span id="aiConfidencePct" class="font-black font-mono text-xs text-indigo-700">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                      <div id="aiConfidenceBar" class="bg-gradient-to-r from-amber-400 to-emerald-500 h-2.5 rounded-full transition-all duration-300 w-0"></div>
                    </div>
                    <div id="aiDetectedClues" class="flex flex-wrap gap-1 mt-1.5 min-h-[18px]"></div>
                  </div>
                </div>

                <!-- REALTIME SPEECH MONITOR (LIVE STREAMING) -->
                <div class="w-full bg-black/60 backdrop-blur-md rounded-2xl p-2.5 border border-white/10 text-right">
                  <div class="flex justify-between items-center text-[11px] text-yellow-300 font-bold mb-1">
                    <span><i class="fa-solid fa-ear-listen animate-pulse"></i> ما يسمعه الميكروفون الآن (مباشر):</span>
                    <span id="aiStatusPill" class="text-amber-300 font-mono text-[10px]">المايك متوقف (اضغط للتحدث) 🎙️</span>
                  </div>
                  <div id="playTranscript" class="text-xs font-bold text-white min-h-[30px] max-h-[36px] overflow-hidden leading-tight">
                    اضغط على زر الميكروفون بالأعلى أو زر الكتابة ⌨️ لبدء الشرح...
                  </div>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="w-full grid grid-cols-2 gap-2.5 pb-2">
                  <button onclick="window.game.abandonStage()" class="btn-3d py-3.5 bg-slate-800 rounded-2xl border-b-[4px] border-slate-950 text-white font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>انسحاب للخريطة</span>
                  </button>

                  <button id="btnNextStage" onclick="window.game.onNextClicked()" disabled class="btn-3d py-3.5 bg-slate-800 text-gray-500 rounded-2xl border-b-[4px] border-slate-950 font-black text-xs flex items-center justify-center space-x-1.5 space-x-reverse cursor-not-allowed opacity-60 transition-all duration-300">
                    <i id="btnNextIcon" class="fa-solid fa-hourglass-half"></i>
                    <span id="btnNextLabel">في انتظار الشرح... (0%)</span>
                  </button>
                </div>
              </div>

              <!-- SCREEN 4: LEVEL VICTORY SCREEN -->
              <div id="screenWin" class="hidden flex-1 flex flex-col items-center justify-between px-6 py-6 z-10 text-center">
                <div class="pt-4">
                  <div class="w-20 h-20 mx-auto bg-amber-400 rounded-full flex items-center justify-center text-4xl shadow-2xl animate-bounce">
                    🌟
                  </div>
                  <h2 class="text-3xl font-black text-white mt-3 font-tajawal drop-shadow">
                    أحسنت يا معلّم!
                  </h2>
                  <div id="winStarsAwarded" class="text-3xl text-amber-300 my-1">⭐⭐⭐</div>
                  <p id="winStageLabel" class="text-indigo-200 text-xs font-bold">حكم الذكاء الاصطناعي بنجاحك الساحق!</p>
                </div>

                <div class="w-full clay-card p-4 text-right space-y-2">
                  <div class="flex justify-between items-center border-b pb-1.5 text-xs font-bold">
                    <span class="text-slate-600">المرحلة القادمة:</span>
                    <span id="nextLevelUnlockText" class="font-black text-indigo-700">مرحلة 2 (مفتوحة الآن 🔓)</span>
                  </div>
                  <div class="flex justify-between items-center text-xs font-bold">
                    <span class="text-slate-600">مكافأة الفوز:</span>
                    <span class="font-black text-emerald-600">+25 نجمة ذهبية إلى محفظتك ⭐</span>
                  </div>
                </div>

                <div class="w-full space-y-2.5 pb-2">
                  <button onclick="window.game.playNextStage()" class="btn-3d w-full py-3.5 bg-gradient-to-r from-emerald-500 to-green-600 rounded-2xl border-b-[5px] border-emerald-800 text-white font-black text-base flex items-center justify-center space-x-2 space-x-reverse">
                    <span>الانتقال للمرحلة التالية</span>
                    <i class="fa-solid fa-arrow-left"></i>
                  </button>
                  <button onclick="window.game.showScreen('screenMap')" class="btn-3d w-full py-3 bg-white text-slate-800 rounded-2xl border-b-[4px] border-slate-300 font-black text-xs">
                    العودة لخريطة المراحل 🗺️
                  </button>
                </div>
              </div>

              <!-- MODAL: FIRST TIME INSTALL WELCOME (1000 STARS) -->
              <div id="modalWelcomeBonus" class="hidden absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                <div class="w-full max-w-sm clay-card p-6 flex flex-col items-center text-center space-y-3 relative overflow-hidden border-4 border-yellow-300 shadow-2xl">
                  <div class="w-24 h-24 bg-gradient-to-tr from-amber-400 to-yellow-200 rounded-3xl flex items-center justify-center text-5xl shadow-2xl gift-bounce border-2 border-white">
                    👑
                  </div>
                  <h3 class="text-2xl font-black text-slate-900 font-tajawal">أهلاً بك يا معلّم!</h3>
                  <div class="bg-amber-100 text-amber-950 font-black text-lg px-5 py-2 rounded-full border border-amber-300 shadow">
                    +1000 نجمة ذهبية مجاناً ⭐
                  </div>
                  <p class="text-xs text-slate-600 font-bold leading-relaxed">
                    هدية تثبيت اللعبة لأول مرة في هاتفك! استخدم النجوم لكشف الكلمات الدلالية والاستمتاع بتحدي الـ 200 مرحلة.
                  </p>
                  <button onclick="window.game.closeWelcomeModal()" class="btn-3d w-full py-3 bg-gradient-to-r from-emerald-500 to-green-600 text-white font-black text-sm rounded-2xl border-b-[4px] border-emerald-800 shadow">
                    ابدأ المغامرة الآن 🚀
                  </button>
                </div>
              </div>

              <!-- MODAL: DAILY REWARD (300 STARS) -->
              <div id="modalDailyReward" class="hidden absolute inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4">
